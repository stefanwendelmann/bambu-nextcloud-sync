name: Publish image

# Images are published only after the complete test suite passed for the same commit.
#   main    -> latest, sha-<commit>
#   v1.2.3  -> 1.2.3, 1.2, sha-<commit>
on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      # Docker Hub is optional: without the two repository secrets only GHCR is published.
      DOCKERHUB_ENABLED: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_ENABLED == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}
            name=${{ secrets.DOCKERHUB_USERNAME }}/bambu-nextcloud-sync,enable=${{ env.DOCKERHUB_ENABLED }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Update the Docker Hub overview from README.md
        if: env.DOCKERHUB_ENABLED == 'true' && github.ref == 'refs/heads/main'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          token_response=$(curl --fail --silent --show-error \
            --request POST \
            --header 'Content-Type: application/json' \
            --data "$(jq -n --arg identifier "$DOCKERHUB_USERNAME" --arg secret "$DOCKERHUB_TOKEN" \
              '{identifier: $identifier, secret: $secret}')" \
            https://hub.docker.com/v2/auth/token)
          token=$(jq -er '.access_token' <<<"$token_response")
          echo "::add-mask::$token"
          payload=$(jq -n \
            --arg description 'Sync Bambu Lab .3mf project files to a Nextcloud folder with rclone.' \
            --rawfile full_description README.md \
            '{description: $description, full_description: $full_description}')
          curl --fail --silent --show-error --output /dev/null \
            --request PATCH \
            --header "Authorization: Bearer $token" \
            --header 'Content-Type: application/json' \
            --data "$payload" \
            "https://hub.docker.com/v2/repositories/$DOCKERHUB_USERNAME/bambu-nextcloud-sync"
          echo 'Docker Hub overview updated.'
