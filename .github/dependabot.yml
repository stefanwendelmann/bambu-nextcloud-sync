version: 2
updates:
  # The pinned rclone base image. Every proposal runs the full test suite before it can be merged.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /tests/integration/ftps
    schedule:
      interval: monthly

  - package-ecosystem: docker-compose
    directory: /tests/integration
    schedule:
      interval: monthly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
