# Test environment only: a printer stand-in, a real Nextcloud and the image under test.
# Started by tests/integration/run.sh, which generates the throwaway passwords.
name: bambu-nextcloud-sync-integration

services:
  ftps:
    build: ./ftps
    # vsftpd must not run as PID 1: it crashes there when a session ends.
    init: true
    environment:
      FTP_PASSWORD: ${FTP_PASSWORD:?}

  nextcloud:
    image: nextcloud:35-apache
    environment:
      SQLITE_DATABASE: nextcloud
      NEXTCLOUD_ADMIN_USER: admin
      NEXTCLOUD_ADMIN_PASSWORD: ${NC_PASSWORD:?}
      NEXTCLOUD_TRUSTED_DOMAINS: nextcloud

  sync:
    image: ${SYNC_IMAGE:?}
    profiles: [sync]
    environment:
      BAMBU_HOST: ftps
      BAMBU_ACCESS_CODE: ${FTP_PASSWORD:?}
      BAMBU_TLS_INSECURE: "true"
      NEXTCLOUD_WEBDAV_URL: http://nextcloud/remote.php/dav/files/admin/
      NEXTCLOUD_USERNAME: admin
      NEXTCLOUD_APP_PASSWORD: ${NC_PASSWORD:?}
      STABILITY_CHECK_INTERVAL: "2"
      RUN_ONCE: "true"
    volumes:
      - syncdata:/data
    # Same runtime settings as the published compose.yaml.
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  syncdata:
